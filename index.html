<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charles</title>
<link rel="stylesheet" href="style.css">
<style>
  .titre-accueil { font-size: 3rem; text-align: center; color: var(--or); letter-spacing: 4px; margin: 24px 0 4px; }
  .sous-titre { text-align: center; color: var(--gris); margin-bottom: 28px; }
  .section-titre { color: var(--blanc); font-size: 1.2rem; margin: 26px 0 12px; border-left: 4px solid var(--or); padding-left: 10px; }
  .grille { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .grille { grid-template-columns: 1fr 1fr; } }
  .carte-exo { display: block; background: var(--noir-2); border: 1px solid var(--or-fonce); border-radius: 18px; padding: 20px; text-decoration: none; color: var(--blanc); transition: transform 0.15s, border-color 0.15s; }
  .carte-exo:active, .carte-exo:hover { transform: translateY(-3px); border-color: var(--or); }
  .carte-exo .icone { font-size: 2rem; }
  .carte-exo h3 { color: var(--or); margin: 8px 0 4px; }
  .carte-exo p { color: var(--gris); font-size: 0.95rem; }
  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--noir-2); border: 1px solid var(--noir-3); border-radius: 14px; padding: 12px; text-align: center; }
  .stat .nb { font-size: 1.6rem; color: var(--or); font-weight: 700; }
  .stat .lib { font-size: 0.8rem; color: var(--gris); }
</style>
</head>
<body>
<div class="container">

  <h1 class="titre-accueil">CHARLES</h1>
  <p class="sous-titre">Mes exercices du jour</p>

  <div class="stats">
    <div class="stat"><div class="nb" id="statSerie">0</div><div class="lib">jours de suite</div></div>
    <div class="stat"><div class="nb" id="statTests">0</div><div class="lib">tests terminés</div></div>
    <div class="stat"><div class="nb" id="statEtoiles">0</div><div class="lib">étoiles</div></div>
  </div>

  <h2 class="section-titre">Devoirs</h2>
  <div class="grille">
    <a class="carte-exo" href="sciences1.html">
      <div class="icone">🔬</div>
      <h3>Sciences : l'alimentation</h3>
      <p>Prépare ton évaluation : origine, rôles des aliments et digestion.</p>
    </a>
  </div>

  <h2 class="section-titre">Exercices</h2>
  <div class="grille">
    <a class="carte-exo" href="determinants.html">
      <div class="icone">✏️</div>
      <h3>Grammaire : les déterminants</h3>
      <p>Test de 20 questions avec des pièges.</p>
    </a>
  </div>

</div>

<script>
  try {
    var s = JSON.parse(localStorage.getItem('charles_stats')) || {};
    document.getElementById('statSerie').textContent = s.serie || 0;
    document.getElementById('statTests').textContent = s.tests || 0;
    document.getElementById('statEtoiles').textContent = s.etoiles || 0;
  } catch (e) {}
</script>
</body>
</html>
